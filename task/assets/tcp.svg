<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540"><rect width="1400" height="540" fill="white"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202124}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px;fill:#5f6368}.l{stroke:#747b83;stroke-width:3}.a{stroke:#1a73e8;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker></defs><text class="h" x="700" y="50" text-anchor="middle">TCP three-way handshake</text><text class="t" x="230" y="110" text-anchor="middle">pc1 · client</text><text class="t" x="1170" y="110" text-anchor="middle">pc2 · server :8080</text><line class="l" x1="230" y1="130" x2="230" y2="470"/><line class="l" x1="1170" y1="130" x2="1170" y2="470"/><line class="a" x1="250" y1="190" x2="1140" y2="240"/><text class="s" x="700" y="195" text-anchor="middle">SYN · Seq=x</text><line class="a" x1="1140" y1="285" x2="250" y2="335"/><text class="s" x="700" y="290" text-anchor="middle">SYN, ACK · Seq=y · Ack=x+1</text><line class="a" x1="250" y1="380" x2="1140" y2="430"/><text class="s" x="700" y="385" text-anchor="middle">ACK · Ack=y+1</text></svg>